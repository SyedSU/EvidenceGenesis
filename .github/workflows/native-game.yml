name: Native Windows game
on:
  workflow_dispatch:
  push:
    branches: ['main', 'feat/native-game', 'feat/workshop-profiles']
    paths: ['native/**', 'scripts/**', 'tests/test_component_packages.py', 'tests/test_native_save_safety.py', 'tests/test_save_adapter.py', 'tests/test_native_build_output.py', '.github/workflows/native-game.yml']
concurrency:
  group: native-game-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deterministic component packaging
        run: python -m unittest discover -s tests -p test_component_packages.py
      - name: Build and test the Windows game and bundled AI
        run: python scripts/build_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: EvidenceGenesis-Windows-v0.5.0
          path: build/EvidenceGenesis-Windows-v0.5.0.zip
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: EvidenceGenesis-components-v0.5.0
          path: build/components/*
          retention-days: 30
          if-no-files-found: error
